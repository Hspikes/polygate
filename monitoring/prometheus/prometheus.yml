global:
  # Short intervals make local demonstrations react quickly.
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/polygate-rules.yml

scrape_configs:
  - job_name: polygate-gateway
    metrics_path: /metrics
    static_configs:
      # Prometheus runs inside Compose, so it reaches the gateway by its
      # Compose service name rather than through localhost.
      - targets:
          - gateway:8000

  # Job names match prometheus-kubernetes.yml so the same dashboard queries and
  # smoke assertions work locally and on EKS without rewriting.
  - job_name: polygate-automation-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - automation:8020

  - job_name: polygate-automation-worker
    metrics_path: /metrics
    static_configs:
      - targets:
          - automation-worker:9000
