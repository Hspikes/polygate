map "${WEB_GATEWAY_API_KEY}" $web_gateway_authorization {
    default "Bearer ${WEB_GATEWAY_API_KEY}";
    "" "";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Agent tool results and long contexts can exceed the original Web-only 1 MiB limit.
    client_max_body_size 4m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Allowlist, not blocklist: only the browser-facing /v1 surface is proxied
    # with the Web identity. A blanket "location /api/" would forward every
    # Gateway route, including /metrics, /openapi.json, /docs and
    # /internal/routing/simulate — and because this block injects the Web's
    # server-side credential, an anonymous visitor would reach them as Web.
    # Any new internal Gateway route is therefore denied by default.
    location /api/v1/ {
        proxy_pass http://gateway:8000/v1/;
        proxy_http_version 1.1;
        # The browser must never choose or observe this internal identity.
        # This directive overwrites any client-supplied Authorization header.
        proxy_set_header Authorization $web_gateway_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
    }

    # Everything else under /api/ is not part of the browser contract. Return
    # 404 explicitly rather than letting it fall through to the SPA, so probes
    # get a clear answer and no Gateway surface is reachable by accident.
    location /api/ {
        return 404;
    }

    # Public OpenAI-compatible entry used by Pi and other Agent clients.
    # Keep it separate from /api/ so POLYGATE_BASE_URL can end in a normal /v1.
    location /v1/ {
        proxy_pass http://gateway:8000/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        add_header X-Accel-Buffering no always;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
