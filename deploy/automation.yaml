# Private Automation control plane. Opt-in during C1; no public Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation
  labels: { app: automation }
spec:
  replicas: 1
  selector: { matchLabels: { app: automation } }
  template:
    metadata:
      labels: { app: automation }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: automation
          image: 356029564744.dkr.ecr.us-east-1.amazonaws.com/polygate-automation:v1
          ports: [{ name: http, containerPort: 8020 }]
          env:
            - { name: GATEWAY_URL, value: "http://gateway:8000" }
            - { name: AUTOMATION_REDIS_URL, value: "redis://redis:6379/0" }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: automation
spec:
  selector: { app: automation }
  ports: [{ name: http, port: 8020, targetPort: http }]
  type: ClusterIP
