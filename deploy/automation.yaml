# Private Automation control plane. Opt-in during C1; no public Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation
  labels: { app: automation }
spec:
  replicas: 1
  selector: { matchLabels: { app: automation } }
  template:
    metadata:
      labels: { app: automation }
    spec:
      serviceAccountName: polygate-policy-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: automation
          image: 356029564744.dkr.ecr.us-east-1.amazonaws.com/polygate-automation:v1
          ports: [{ name: http, containerPort: 8020 }]
          env:
            - { name: GATEWAY_URL, value: "http://gateway:8000" }
            - { name: AUTOMATION_REDIS_URL, value: "redis://redis:6379/0" }
            - { name: POLICY_FILE, value: "/config/policy-store.json" }
            - { name: POLICY_ADMIN_KEY_FILE, value: "/var/run/secrets/polygate-policy/admin-key" }
            - { name: POLICY_CONFIGMAP_NAME, value: "polygate-routing-policy" }
            - { name: POLICY_CONFIGMAP_KEY, value: "policy-store.json" }
            - { name: POLICY_REFRESH_SECONDS, value: "5" }
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: { fieldPath: metadata.namespace }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: policy-config, mountPath: /config, readOnly: true }
            - { name: policy-admin, mountPath: /var/run/secrets/polygate-policy, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policy-config
          projected:
            sources:
              - configMap:
                  name: polygate-routing-policy
                  items:
                    - { key: policy-store.json, path: policy-store.json }
        - name: policy-admin
          secret:
            secretName: polygate-policy-admin
            items:
              - { key: admin-key, path: admin-key }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: automation-worker
  labels: { app: automation-worker }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector: { matchLabels: { app: automation-worker } }
  template:
    metadata:
      labels: { app: automation-worker }
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: automation-worker
          image: 356029564744.dkr.ecr.us-east-1.amazonaws.com/polygate-automation:v1
          command: ["python", "-m", "automation.app.worker"]
          ports: [{ name: metrics, containerPort: 9000 }]
          env:
            - { name: GATEWAY_URL, value: "http://gateway:8000" }
            - { name: AUTOMATION_REDIS_URL, value: "redis://redis:6379/0" }
            - { name: POLICY_FILE, value: "/config/policy-store.json" }
            - { name: POLICY_API_URL, value: "http://automation:8020" }
            - { name: POLICY_REFRESH_SECONDS, value: "5" }
            - { name: WORKER_CONCURRENCY, value: "1" }
            - { name: WORKER_HEALTH_PORT, value: "9000" }
            - name: POLYGATE_API_KEY
              valueFrom:
                secretKeyRef: { name: gateway-client-secrets, key: worker-api-key, optional: true }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: policy-config, mountPath: /config, readOnly: true }
      volumes:
        - name: tmp
          emptyDir: {}
        - name: policy-config
          projected:
            sources:
              - configMap:
                  name: polygate-routing-policy
                  items:
                    - { key: policy-store.json, path: policy-store.json }
---
apiVersion: v1
kind: Service
metadata:
  name: automation
spec:
  selector: { app: automation }
  ports: [{ name: http, port: 8020, targetPort: http }]
  type: ClusterIP
