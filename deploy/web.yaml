# Single public entry point: static React assets plus same-origin /api proxy to Gateway.
apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: 356029564744.dkr.ecr.us-east-1.amazonaws.com/polygate-web:v1
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - name: WEB_GATEWAY_API_KEY
              valueFrom: { secretKeyRef: { name: gateway-client-secrets, key: web-api-key } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          readinessProbe: { httpGet: { path: /api/v1/models, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          volumeMounts:
            - { name: nginx-tmp, mountPath: /tmp }
      volumes:
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
  selector: { app: web }
  ports: [{ name: http, port: 80, targetPort: http, nodePort: 30080 }]
  type: NodePort
