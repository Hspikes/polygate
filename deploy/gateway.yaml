# Stateless gateway Deployment + Service + HPA-ready resource requests. Owned by Member C.
apiVersion: v1
kind: ConfigMap
metadata: { name: providers-config }
data:
  providers.yaml: |
    # C: keep this in sync with contracts/providers.yaml, but point endpoints at
    # in-cluster service DNS (http://mock-a:8080/... instead of localhost).
    # For P0 you can also bake providers.yaml into the image; ConfigMap is cleaner.
    placeholder: "replace with contracts/providers.yaml (cluster endpoints)"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: REGISTRY/polygate-gateway:latest   # C: replace REGISTRY
          ports: [{ containerPort: 8000 }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: PROVIDERS_FILE, value: "/config/providers.yaml" }
            - name: REAL_A_API_KEY
              valueFrom: { secretKeyRef: { name: provider-secrets, key: real-a-key, optional: true } }
          # HPA needs requests set to compute utilization %:
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          volumeMounts: [{ name: cfg, mountPath: /config }]
      volumes:
        - name: cfg
          configMap: { name: providers-config }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [{ port: 80, targetPort: 8000 }]
  type: NodePort   # P0: NodePort like the tutorial. Remember the EKS node security-group step!
