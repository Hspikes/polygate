# Stateless gateway Deployment + Service + HPA-ready resource requests. Owned by Member C.
apiVersion: v1
kind: ConfigMap
metadata: { name: providers-config }
data:
  providers.yaml: |
    # Cluster version of contracts/providers.yaml.
    # Differences from the local (compose) version:
    #   - mock endpoints use in-cluster service DNS (same names as compose services, so identical here)
    #   - real-a endpoint hardcoded to its default (no shell ${VAR:-default} expansion needed;
    #     the gateway still reads the API key from the REAL_A_API_KEY env var / Secret)
    
    providers:
      - name: real-a
        kind: real
        endpoint: https://api.deepseek.com/v1/chat/completions
        api_key_env: REAL_A_API_KEY
        model: deepseek-v4-flash
        price_per_1k_input: 0.00014
        price_per_1k_output: 0.00028
        privacy: external
        typical_latency_ms: 1500
        context_window: 1000000
        max_output_tokens: 8192
        capabilities:
          streaming: true
          tools: true
          parallel_tool_calls: true
          vision: false
          content_blocks: false
          developer_role: false
          store: false
      - name: mock-a
        kind: mock
        endpoint: http://mock-a:8080/v1/chat/completions
        admin_endpoint: http://mock-a:8080/admin/config
        model: mock-fast
        price_per_1k_input: 0.0001
        price_per_1k_output: 0.0002
        privacy: internal
        typical_latency_ms: 300
        context_window: 64000
        max_output_tokens: 8192
        capabilities:
          streaming: true
          tools: true
          parallel_tool_calls: true
          vision: false
          content_blocks: true
          developer_role: true
          store: true
      - name: mock-b
        kind: mock
        endpoint: http://mock-b:8080/v1/chat/completions
        admin_endpoint: http://mock-b:8080/admin/config
        model: mock-cheap
        price_per_1k_input: 0.00005
        price_per_1k_output: 0.00008
        privacy: internal
        typical_latency_ms: 900
        context_window: 64000
        max_output_tokens: 8192
        capabilities:
          streaming: true
          tools: true
          parallel_tool_calls: true
          vision: false
          content_blocks: true
          developer_role: true
          store: true
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway }
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: 356029564744.dkr.ecr.us-east-1.amazonaws.com/polygate-gateway:v2
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - { name: PROVIDERS_FILE, value: "/config/providers.yaml" }
            - { name: PROVIDER_TIMEOUT_SECONDS, value: "10" }
            - { name: PROVIDER_STREAM_IDLE_TIMEOUT_SECONDS, value: "90" }
            - { name: GATEWAY_NON_STREAM_BUDGET_SECONDS, value: "30" }
            - { name: GATEWAY_STREAM_START_BUDGET_SECONDS, value: "30" }
            - { name: PROVIDER_MAX_RETRIES, value: "2" }
            - { name: PROVIDER_RETRY_BASE_DELAY_SECONDS, value: "0.2" }
            - { name: PROVIDER_RETRY_MAX_BACKOFF_SECONDS, value: "5" }
            - { name: DECISION_RECORD_TTL_SECONDS, value: "3600" }
            - name: REAL_A_API_KEY
              valueFrom: { secretKeyRef: { name: provider-secrets, key: real-a-key, optional: true } }
            - name: POLYGATE_API_KEYS
              valueFrom: { secretKeyRef: { name: gateway-client-secrets, key: api-keys, optional: true } }
          # HPA needs requests set to compute utilization %:
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10, periodSeconds: 10 }
          volumeMounts: [{ name: cfg, mountPath: /config }]
      volumes:
        - name: cfg
          configMap: { name: providers-config }
---
apiVersion: v1
kind: Service
metadata: { name: gateway }
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 8000, targetPort: http }]
  type: ClusterIP
