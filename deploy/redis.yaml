# Redis WITHOUT persistent storage (emptyDir). Fallback if EBS CSI Driver / Pod Identity
# role setup is blocked by Learner Lab IAM restrictions.
#
# Tradeoff: cache data is lost if the Redis pod restarts (node replaced, pod evicted, etc).
# Acceptable for this project — Redis here is a CACHE, not a source of truth. If it happens
# right before a demo, just re-run one request first to "warm" the cache again.
#
# Swap back to deploy/redis.yaml (PVC-based) any time the EBS CSI Driver gets sorted out —
# nothing else in the stack needs to change, same Service name/port.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: redis }
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
  clusterIP: None
