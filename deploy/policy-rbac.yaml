apiVersion: v1
kind: ServiceAccount
metadata:
  name: polygate-policy-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polygate-policy-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["polygate-routing-policy"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polygate-policy-controller
subjects:
  - kind: ServiceAccount
    name: polygate-policy-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polygate-policy-controller
