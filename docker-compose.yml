# Local end-to-end stack. This is the KEY to parallel work:
# A/B/D develop here every day; only Member C touches EKS (until Day-4 integration).
# Start everything:   docker compose up --build
# Then open web/index.html in a browser (or serve web/ on :8080).
# The monitoring dashboard is available at http://localhost:3000.
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mock-a:
    build: ./providers/mock
    environment: { MOCK_NAME: mock-a }
    ports: ["8081:8080"]

  mock-b:
    build: ./providers/mock
    environment: { MOCK_NAME: mock-b }
    ports: ["8082:8080"]

  gateway:
    build: ./gateway
    depends_on: [redis, mock-a, mock-b]
    environment:
      REDIS_URL: redis://redis:6379/0
      PROVIDERS_FILE: /app/providers.yaml
      # REAL_A_API_KEY: set this in a local .env (never commit it) to enable real-a
    ports: ["8000:8000"]
    volumes:
      - ./contracts/providers.yaml:/app/providers.yaml:ro

  prometheus:
    image: prom/prometheus:v3.13.1
    depends_on: [gateway]
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  monitoring-api:
    build: ./monitoring/api
    depends_on: [prometheus]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TIMEOUT_SECONDS: "3"
    ports: ["8010:8010"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:12.4.0
    depends_on: [prometheus]
    environment:
      # Local development is intentionally login-free. Do not copy this
      # anonymous access setting into a public deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # The dashboard only uses Grafana's built-in Prometheus support.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/polygate-overview.json
    ports: ["3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  prometheus-data:
  grafana-data:
