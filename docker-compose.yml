# Local end-to-end stack. This is the KEY to parallel work:
# A/B/D develop here every day; only Member C touches EKS (until Day-4 integration).
# Start everything:   docker compose up --build
# Then open web/index.html in a browser (or serve web/ on :8080).
# The monitoring dashboard is available at http://localhost:3000.
services:
  policy-bootstrap:
    image: python:3.12-slim
    command:
      - /bin/sh
      - -ec
      - >-
        python /bootstrap/render-default-policy-store.py
        /contracts/policy-examples.json
        > /policy/policy-store.json.tmp
        && mv /policy/policy-store.json.tmp /policy/policy-store.json
    volumes:
      - ./scripts/render-default-policy-store.py:/bootstrap/render-default-policy-store.py:ro
      - ./contracts/policy-examples.json:/contracts/policy-examples.json:ro
      - policy-store:/policy

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  mock-a:
    build: ./providers/mock
    environment: { MOCK_NAME: mock-a }
    ports: ["8081:8080"]

  mock-b:
    build: ./providers/mock
    environment: { MOCK_NAME: mock-b }
    ports: ["8082:8080"]

  gateway:
    build: ./gateway
    depends_on:
      redis: { condition: service_started }
      mock-a: { condition: service_started }
      mock-b: { condition: service_started }
      policy-bootstrap: { condition: service_completed_successfully }
    environment:
      REDIS_URL: redis://redis:6379/0
      PROVIDERS_FILE: /app/providers.yaml
      POLICY_FILE: /config/policy-store.json
      POLICY_API_URL: http://automation:8020
      POLICY_REFRESH_SECONDS: "5"
      REAL_A_API_KEY:  ${REAL_A_API_KEY}
      # Set this to require Bearer auth (for example: local-development).
      POLYGATE_API_KEYS: ${POLYGATE_API_KEYS:-}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-10}
      PROVIDER_STREAM_IDLE_TIMEOUT_SECONDS: ${PROVIDER_STREAM_IDLE_TIMEOUT_SECONDS:-90}
      GATEWAY_NON_STREAM_BUDGET_SECONDS: ${GATEWAY_NON_STREAM_BUDGET_SECONDS:-30}
      GATEWAY_STREAM_START_BUDGET_SECONDS: ${GATEWAY_STREAM_START_BUDGET_SECONDS:-30}
      PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-4}
      PROVIDER_RETRY_BASE_DELAY_SECONDS: ${PROVIDER_RETRY_BASE_DELAY_SECONDS:-0.5}
      PROVIDER_RETRY_MAX_BACKOFF_SECONDS: ${PROVIDER_RETRY_MAX_BACKOFF_SECONDS:-5}
      DECISION_RECORD_TTL_SECONDS: ${DECISION_RECORD_TTL_SECONDS:-3600}
    ports: ["8000:8000"]
    volumes:
      - ./contracts/providers.yaml:/app/providers.yaml:ro
      - policy-store:/config:ro

  automation:
    build:
      context: .
      dockerfile: automation/Dockerfile
    depends_on:
      gateway: { condition: service_started }
      redis: { condition: service_started }
      policy-bootstrap: { condition: service_completed_successfully }
    environment:
      GATEWAY_URL: http://gateway:8000
      AUTOMATION_REDIS_URL: redis://redis:6379/0
      POLICY_FILE: /config/policy-store.json
      POLICY_ADMIN_KEY: local-policy-admin-development
      POLICY_ALLOW_ENV_ADMIN_KEY: "true"
      POLICY_REFRESH_SECONDS: "5"
    ports: ["127.0.0.1:8020:8020"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8020/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - policy-store:/config:ro

  automation-worker:
    build:
      context: .
      dockerfile: automation/Dockerfile
    command: ["python", "-m", "automation.app.worker"]
    depends_on:
      gateway: { condition: service_started }
      redis: { condition: service_started }
      automation: { condition: service_healthy }
      policy-bootstrap: { condition: service_completed_successfully }
    environment:
      GATEWAY_URL: http://gateway:8000
      AUTOMATION_REDIS_URL: redis://redis:6379/0
      POLICY_FILE: /config/policy-store.json
      POLICY_API_URL: http://automation:8020
      POLICY_REFRESH_SECONDS: "5"
      POLYGATE_API_KEY: ""
    ports: ["9000:9000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)"
      interval: 10s
    restart: unless-stopped
    volumes:
      - policy-store:/config:ro

  web:
    build: ./web
    depends_on: [gateway]
    environment:
      # Dedicated server-side identity injected by Nginx; never enters static JS.
      WEB_GATEWAY_API_KEY: ${WEB_GATEWAY_API_KEY:-}
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/v1/models"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.13.1
    depends_on: [gateway]
    ports: ["9090:9090"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/polygate-rules.yml:/etc/prometheus/polygate-rules.yml:ro
      - prometheus-data:/prometheus

  monitoring-api:
    build: ./monitoring/api
    depends_on: [prometheus]
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      PROMETHEUS_TIMEOUT_SECONDS: "3"
    ports: ["8010:8010"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  grafana:
    image: grafana/grafana:12.4.0
    depends_on: [prometheus]
    environment:
      # Local development is intentionally login-free. Do not copy this
      # anonymous access setting into a public deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # The dashboard only uses Grafana's built-in Prometheus support.
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/polygate-overview.json
    ports: ["3000:3000"]
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://localhost:3000/api/health || exit 1
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s

volumes:
  policy-store:
  prometheus-data:
  grafana-data:
